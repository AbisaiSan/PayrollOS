<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayrollOS — Protótipo de Design</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  /* brand — fixed per briefing */
  --orange-50:#FEF3ED; --orange-100:#FDE2D3; --orange-200:#FAC4A7; --orange-300:#F7A57B;
  --orange-400:#F5904F; --orange-500:#F37B46; --orange-600:#DB5F26; --orange-700:#B14A1D;
  --orange-800:#87381A; --orange-900:#5C2712;
  --blue-50:#EDF1FA; --blue-100:#D4DCF2; --blue-200:#A9B9E5; --blue-300:#7E95D8;
  --blue-400:#5372CB; --blue-500:#3457B4; --blue-600:#214396; --blue-700:#1A3577;
  --blue-800:#132758; --blue-900:#0C1939;
  --ink:#0D0E0E; --app-bg:#EFEFEE; --white:#FFFFFF;

  /* semantic status — distinguishable by shape+color, independent of brand palette */
  --success:#146C43; --success-bg:#E7F5EC; --success-line:#BFE3CC;
  --info:#0E7C86; --info-bg:#E3F5F6; --info-line:#BEE4E7;
  --warn:#9A6300; --warn-bg:#FBF0DC; --warn-line:#F0DBA8;
  --danger:#B3261E; --danger-bg:#FBEAE8; --danger-line:#F3C6C1;
  --secondary:#5B6169; --secondary-bg:#EEEFF0; --secondary-line:#D9DBDE;

  /* neutrals derived from ink */
  --ink-90:rgba(13,14,14,.90); --ink-70:rgba(13,14,14,.70); --ink-55:rgba(13,14,14,.55);
  --ink-35:rgba(13,14,14,.35); --ink-16:rgba(13,14,14,.12); --ink-08:rgba(13,14,14,.07);

  --font-ui:'IBM Plex Sans', -apple-system, sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  --radius-sm:6px; --radius-md:10px; --radius-lg:14px;
  --shadow-card:0 1px 2px rgba(13,14,14,.06), 0 1px 1px rgba(13,14,14,.04);
  --shadow-pop:0 12px 32px rgba(13,14,14,.18), 0 2px 8px rgba(13,14,14,.10);
  --sidebar-w:256px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-ui);
  color:var(--ink);
  background:#15161A;
  -webkit-font-smoothing:antialiased;
}
button, input, select, textarea{font-family:inherit;}
::selection{background:var(--orange-200);}
a{color:inherit;}
.hidden{display:none !important;}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--blue-500);outline-offset:2px;}

/* ============ PROTOTYPE CHROME (meta — not part of the product) ============ */
.proto-topbar{
  height:44px;background:#15161A;color:#DEDFE3;display:flex;align-items:center;gap:14px;
  padding:0 16px;font-size:12.5px;position:sticky;top:0;z-index:500;border-bottom:1px solid #2A2C33;
}
.proto-topbar .proto-brand{font-weight:600;color:#fff;letter-spacing:.2px;display:flex;align-items:center;gap:8px;}
.proto-topbar .proto-brand .dot{width:7px;height:7px;border-radius:50%;background:var(--orange-500);}
.proto-sep{width:1px;height:18px;background:#33353D;}
.proto-nav-btn{
  background:#22242B;border:1px solid #34363F;color:#DEDFE3;border-radius:7px;padding:5px 9px;
  font-size:12.5px;display:flex;align-items:center;gap:6px;
}
.proto-nav-btn:hover{background:#2B2D35;border-color:#43454F;}
.proto-select{
  background:#22242B;border:1px solid #34363F;color:#fff;border-radius:7px;padding:5px 10px;
  font-size:12.5px;max-width:340px;
}
.proto-count{color:#8B8D97;font-size:12px;}
.proto-count b{color:#DEDFE3;font-weight:600;}
.proto-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.proto-viewport-toggle{display:flex;background:#22242B;border:1px solid #34363F;border-radius:7px;overflow:hidden;}
.proto-viewport-toggle button{background:transparent;border:0;color:#9A9CA6;padding:5px 10px;font-size:12px;display:flex;align-items:center;gap:5px;}
.proto-viewport-toggle button.active{background:var(--orange-500);color:#fff;}

.proto-stage{background:#15161A;min-height:calc(100vh - 44px);padding:28px 20px 60px;display:flex;justify-content:center;}
.device{width:100%;max-width:1440px;background:var(--app-bg);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-pop);}
.device.mobile{max-width:390px;}
.device-frame-label{color:#6E7079;font-size:11px;text-align:center;margin-bottom:8px;letter-spacing:.02em;}

/* ============ APP SHELL ============ */
.app-shell{display:flex;min-height:760px;position:relative;background:var(--app-bg);}
.sidebar{
  width:var(--sidebar-w);flex:0 0 auto;background:var(--blue-600);
  background-image:linear-gradient(180deg, var(--blue-600), var(--blue-700) 100%);
  color:#fff;display:flex;flex-direction:column;padding:20px 14px;gap:4px;
}
.mobile .sidebar{position:fixed;top:0;bottom:0;left:0;z-index:80;transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--shadow-pop);}
.mobile .sidebar.open{transform:translateX(0);}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:6px 8px 22px;}
.sidebar-logo svg{flex:0 0 auto;}
.sidebar-logo-text{font-weight:700;font-size:16.5px;letter-spacing:.01em;}
.sidebar-logo-text small{display:block;font-weight:400;font-size:10.5px;color:rgba(255,255,255,.62);letter-spacing:.04em;text-transform:uppercase;margin-top:1px;}
.nav-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,.42);padding:14px 10px 6px;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:rgba(255,255,255,.72);
  font-size:13.75px;font-weight:500;border:0;background:transparent;width:100%;text-align:left;
}
.nav-item svg{opacity:.85;flex:0 0 auto;}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff;}
.nav-item.active{background:var(--orange-500);color:#fff;}
.nav-item.active svg{opacity:1;}
.sidebar-spacer{flex:1;}
.sidebar-footnote{
  font-size:10.75px;line-height:1.5;color:rgba(255,255,255,.5);border-top:1px solid rgba(255,255,255,.14);
  padding:14px 10px 4px;
}
.sidebar-scrim{display:none;}
.mobile .sidebar-scrim.open{display:block;position:fixed;inset:0;background:rgba(13,14,14,.45);z-index:70;}

.main-col{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;}
.topbar{
  height:64px;background:#fff;border-bottom:1px solid var(--ink-08);display:flex;align-items:center;
  gap:14px;padding:0 24px;position:sticky;top:0;z-index:40;
}
.mobile .topbar{padding:0 14px;}
.hamburger{display:none;background:transparent;border:0;padding:6px;border-radius:7px;color:var(--ink-70);}
.mobile .hamburger{display:flex;}
.hamburger:hover{background:var(--ink-08);}
.topbar-titles{min-width:0;}
.topbar-titles h1{font-size:16.5px;margin:0;font-weight:600;letter-spacing:-.01em;}
.topbar-titles p{font-size:12.5px;margin:1px 0 0;color:var(--ink-55);}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:10px;flex:0 0 auto;}
.mobile .topbar-actions .btn span.lbl{display:none;}
.user-menu{display:flex;align-items:center;gap:9px;padding-left:12px;border-left:1px solid var(--ink-08);margin-left:4px;}
.mobile .user-menu{border-left:0;padding-left:0;margin-left:0;}
.mobile .user-menu .user-meta{display:none;}
.avatar{
  width:32px;height:32px;border-radius:50%;background:var(--blue-600);color:#fff;display:flex;
  align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:0 0 auto;
}
.user-meta{line-height:1.25;}
.user-meta .name{font-size:12.75px;font-weight:600;}
.user-meta .role{font-size:11px;color:var(--ink-55);}

.content{flex:1 1 auto;padding:24px;overflow:auto;}
.mobile .content{padding:16px;}
.content-narrow{max-width:960px;}

/* ============ PRIMITIVES ============ */
.btn{
  display:inline-flex;align-items:center;gap:7px;border-radius:8px;font-size:13.25px;font-weight:600;
  padding:9px 14px;border:1px solid transparent;line-height:1;white-space:nowrap;
}
.btn svg{flex:0 0 auto;}
.btn-primary{background:var(--orange-500);color:#fff;}
.btn-primary:hover{background:var(--orange-600);}
.btn-secondary{background:#fff;color:var(--ink-90);border-color:var(--ink-16);}
.btn-secondary:hover{background:var(--ink-08);}
.btn-ghost{background:transparent;color:var(--ink-70);border-color:transparent;padding:9px 10px;}
.btn-ghost:hover{background:var(--ink-08);color:var(--ink);}
.btn-danger-text{background:transparent;color:var(--danger);border-color:transparent;}
.btn-danger-text:hover{background:var(--danger-bg);}
.btn-sm{padding:6px 10px;font-size:12.25px;border-radius:7px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-block{width:100%;justify-content:center;}

.card{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-card);border:1px solid var(--ink-08);}
.card-pad{padding:20px;}
.card-header{display:flex;align-items:baseline;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--ink-08);}
.card-header h2{font-size:14.5px;margin:0;font-weight:600;}
.card-header .hint{font-size:12px;color:var(--ink-55);}

.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-55);font-weight:600;margin:0 0 12px;}

/* status chip — legible by shape, not only color */
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 9px 4px 7px;border-radius:100px;
  font-size:12.25px;font-weight:600;border:1px solid transparent;white-space:nowrap;
}
.chip svg{flex:0 0 auto;}
.chip-success{background:var(--success-bg);color:var(--success);border-color:var(--success-line);}
.chip-info{background:var(--info-bg);color:var(--info);border-color:var(--info-line);}
.chip-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line);}
.chip-danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-line);}
.chip-secondary{background:var(--secondary-bg);color:var(--secondary);border-color:var(--secondary-line);}

.pix-tag{display:inline-flex;align-items:center;gap:5px;color:var(--blue-600);font-size:12px;font-weight:600;}

/* indicator cards */
.indicators{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.mobile .indicators{grid-template-columns:1fr;}
.indicator-card{background:#fff;border:1px solid var(--ink-08);border-radius:var(--radius-lg);padding:16px 18px;box-shadow:var(--shadow-card);}
.indicator-card.alert{border-color:var(--danger-line);background:linear-gradient(180deg,#fff,var(--danger-bg) 220%);}
.indicator-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.indicator-icon{width:32px;height:32px;border-radius:9px;background:var(--blue-50);color:var(--blue-600);display:flex;align-items:center;justify-content:center;}
.indicator-card.alert .indicator-icon{background:var(--danger-bg);color:var(--danger);}
.indicator-label{font-size:12.25px;color:var(--ink-55);font-weight:500;}
.indicator-value{font-family:var(--font-mono);font-size:22px;font-weight:600;letter-spacing:-.01em;margin:2px 0 3px;}
.indicator-detail{font-size:11.75px;color:var(--ink-55);}
.indicator-card.alert .indicator-detail{color:var(--danger);font-weight:600;}

/* table grammar */
.table-wrap{overflow-x:auto;}
table.grid{width:100%;border-collapse:collapse;font-size:13.25px;}
table.grid thead th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-55);
  font-weight:600;padding:10px 16px;border-bottom:1px solid var(--ink-08);white-space:nowrap;position:sticky;top:0;background:#fff;z-index:2;
}
table.grid th.num, table.grid td.num{text-align:right;}
table.grid tbody td{padding:12px 16px;border-bottom:1px solid var(--ink-08);vertical-align:top;}
table.grid tbody tr{transition:background .1s;}
table.grid tbody tr.clickable{cursor:pointer;}
table.grid tbody tr.clickable:hover{background:var(--orange-50);}
table.grid tbody tr.row-overdue{background:var(--danger-bg);}
table.grid tbody tr.row-overdue:hover{background:#F7DCD9;}
table.grid tbody tr:last-child td{border-bottom:0;}
.cell-primary{font-weight:600;color:var(--ink);}
.cell-primary.link:hover{color:var(--orange-600);text-decoration:underline;}
.cell-sub{font-size:12px;color:var(--ink-55);margin-top:2px;}
.cell-money{font-family:var(--font-mono);font-weight:600;}
.count-badge{font-family:var(--font-mono);font-weight:600;padding:2px 8px;border-radius:100px;background:var(--ink-08);font-size:12.25px;}
.count-badge.zero{background:var(--danger-bg);color:var(--danger);}

.totals-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.total-pill{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--ink-08);border-radius:var(--radius-md);padding:10px 16px;box-shadow:var(--shadow-card);}
.total-pill.alert{border-color:var(--danger-line);background:var(--danger-bg);}
.total-pill .tp-label{font-size:11.5px;color:var(--ink-55);}
.total-pill.alert .tp-label{color:var(--danger);}
.total-pill .tp-value{font-family:var(--font-mono);font-weight:700;font-size:15px;}
.total-pill.alert .tp-value{color:var(--danger);}

/* filters */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.field-control{
  background:#fff;border:1px solid var(--ink-16);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--ink-90);
  display:flex;align-items:center;gap:8px;min-height:36px;
}
.field-control svg{color:var(--ink-35);flex:0 0 auto;}
.field-control input, .field-control select{border:0;background:transparent;outline:0;font-size:13px;color:var(--ink-90);width:100%;}
.field-search{min-width:230px;}
.field-select{min-width:150px;}
.field-date{min-width:140px;}
.btn-clear-filters{color:var(--orange-600);font-size:12.5px;font-weight:600;background:transparent;border:0;display:flex;align-items:center;gap:4px;padding:6px 4px;}

.pagination{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-top:1px solid var(--ink-08);flex-wrap:wrap;gap:10px;}
.pagination .p-info{font-size:12.5px;color:var(--ink-55);}
.pagination .p-size{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-55);}
.pagination .p-size select{border:1px solid var(--ink-16);border-radius:6px;padding:4px 6px;font-size:12.5px;}
.p-pages{display:flex;gap:4px;}
.p-pages button{width:30px;height:30px;border-radius:7px;border:1px solid var(--ink-16);background:#fff;font-size:12.5px;font-weight:600;color:var(--ink-70);}
.p-pages button.active{background:var(--blue-600);border-color:var(--blue-600);color:#fff;}
.p-pages button:hover:not(.active){background:var(--ink-08);}

/* forms */
.form-card{padding:20px;}
.form-card + .form-card{margin-top:16px;}
.form-card h3{font-size:14px;margin:0 0 3px;font-weight:600;}
.form-card .form-card-hint{font-size:12px;color:var(--ink-55);margin:0 0 16px;}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
.mobile .form-grid{grid-template-columns:1fr;}
.form-grid .span-2{grid-column:1 / -1;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12.75px;font-weight:600;color:var(--ink-90);display:flex;align-items:center;gap:5px;}
.field label .req{color:var(--orange-600);}
.field .field-hint{font-size:11.5px;color:var(--ink-55);}
.field .field-hint.linked{color:var(--blue-600);}
.input, select.input, textarea.input{
  border:1px solid var(--ink-16);border-radius:8px;padding:9px 11px;font-size:13.5px;color:var(--ink-90);
  background:#fff;width:100%;
}
.input:focus{border-color:var(--blue-400);}
textarea.input{resize:vertical;min-height:64px;font-family:inherit;}
.input-money{font-family:var(--font-mono);}
.toggle-group{display:flex;background:var(--ink-08);border-radius:8px;padding:3px;gap:2px;}
.toggle-group button{flex:1;padding:8px;border-radius:6px;border:0;background:transparent;font-size:13px;font-weight:600;color:var(--ink-55);display:flex;align-items:center;justify-content:center;gap:6px;}
.toggle-group button.active{background:#fff;color:var(--ink);box-shadow:var(--shadow-card);}
.form-footer{display:flex;justify-content:flex-end;gap:10px;padding:16px 20px;border-top:1px solid var(--ink-08);background:#fff;position:sticky;bottom:0;border-radius:0 0 var(--radius-lg) var(--radius-lg);}

/* two-col detail layout */
.detail-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start;}
.mobile .detail-grid{grid-template-columns:1fr;}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;}
.mobile .dl{grid-template-columns:1fr;}
.dl-item dt{font-size:11.5px;color:var(--ink-55);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
.dl-item dd{margin:0;font-size:13.75px;font-weight:500;}
.dl-item dd.mono{font-family:var(--font-mono);}

.banner{display:flex;gap:10px;align-items:flex-start;background:var(--secondary-bg);border:1px solid var(--secondary-line);border-radius:var(--radius-md);padding:12px 14px;font-size:12.75px;color:var(--ink-70);margin-bottom:16px;}
.banner.warn{background:var(--warn-bg);border-color:var(--warn-line);color:#7A4E00;}
.banner svg{flex:0 0 auto;margin-top:1px;color:inherit;}

/* timeline */
.timeline{position:relative;padding-left:26px;}
.timeline::before{content:'';position:absolute;left:9px;top:6px;bottom:6px;width:1.5px;background:var(--ink-16);}
.timeline-item{position:relative;padding-bottom:20px;}
.timeline-item:last-child{padding-bottom:0;}
.timeline-dot{position:absolute;left:-26px;top:2px;width:19px;height:19px;border-radius:50%;background:#fff;border:2px solid var(--ink-16);display:flex;align-items:center;justify-content:center;}
.timeline-dot.auto{border-style:dashed;}
.timeline-head{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.timeline-meta{font-size:11.75px;color:var(--ink-55);margin-top:2px;}
.timeline-note{font-size:12.5px;color:var(--ink-70);margin-top:5px;background:var(--ink-08);border-radius:7px;padding:7px 10px;}
.auto-tag{font-size:10.5px;background:var(--blue-50);color:var(--blue-600);padding:1px 7px;border-radius:100px;font-weight:600;}

/* accounts panel */
.account-item{border:1px solid var(--ink-08);border-radius:var(--radius-md);padding:13px 14px;margin-bottom:10px;}
.account-item:last-child{margin-bottom:0;}
.account-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.account-bank{font-weight:600;font-size:13.5px;}
.account-nums{font-family:var(--font-mono);font-size:12px;color:var(--ink-55);margin-top:2px;}
.account-holder{font-size:12px;color:var(--ink-55);margin-top:6px;}
.account-tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.tag-primary{background:var(--orange-50);color:var(--orange-700);font-size:11px;font-weight:600;padding:2px 8px;border-radius:100px;}
.tag-inactive{background:var(--secondary-bg);color:var(--secondary);font-size:11px;font-weight:600;padding:2px 8px;border-radius:100px;}
.account-actions{display:flex;gap:12px;margin-top:9px;}
.account-actions button{font-size:11.75px;font-weight:600;color:var(--blue-600);background:transparent;border:0;padding:0;}
.account-actions button.danger{color:var(--danger);}

/* proportion bars */
.prop-row{margin-bottom:12px;}
.prop-row:last-child{margin-bottom:0;}
.prop-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
.prop-top .pname{font-weight:500;}
.prop-top .pval{font-family:var(--font-mono);font-weight:600;}
.prop-track{height:6px;background:var(--ink-08);border-radius:100px;overflow:hidden;}
.prop-fill{height:100%;background:var(--orange-400);border-radius:100px;}

/* modal */
.modal-scrim{position:fixed;inset:0;background:rgba(13,14,14,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal{background:#fff;border-radius:var(--radius-lg);width:100%;max-width:460px;box-shadow:var(--shadow-pop);max-height:90vh;display:flex;flex-direction:column;}
.modal.modal-wide{max-width:620px;}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--ink-08);}
.modal-head h3{margin:0;font-size:15.5px;font-weight:600;}
.modal-head p{margin:3px 0 0;font-size:12.25px;color:var(--ink-55);}
.modal-body{padding:20px;overflow:auto;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 20px;border-top:1px solid var(--ink-08);}
.close-x{background:transparent;border:0;color:var(--ink-55);padding:4px;border-radius:6px;}
.close-x:hover{background:var(--ink-08);color:var(--ink);}
.transition-options{display:flex;flex-direction:column;gap:8px;}
.transition-opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--ink-16);border-radius:9px;padding:11px 12px;background:#fff;text-align:left;}
.transition-opt:hover{border-color:var(--blue-300);background:var(--blue-50);}
.transition-opt.selected{border-color:var(--blue-500);background:var(--blue-50);}
.transition-opt .to-label{font-weight:600;font-size:13.25px;flex:1;}

/* toasts */
.toast-stack{position:fixed;top:76px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px;}
.mobile .toast-stack{right:12px;left:12px;top:70px;}
.toast{display:flex;align-items:flex-start;gap:10px;background:var(--ink);color:#fff;padding:12px 14px;border-radius:10px;box-shadow:var(--shadow-pop);font-size:13px;max-width:340px;}
.toast.success{background:#0F3D24;}
.toast.error{background:#4A130E;}
.toast svg{flex:0 0 auto;margin-top:1px;}

/* empty / loading / error states */
.state-block{display:flex;flex-direction:column;align-items:center;text-align:center;padding:56px 24px;color:var(--ink-55);}
.state-icon{width:52px;height:52px;border-radius:14px;background:var(--ink-08);display:flex;align-items:center;justify-content:center;color:var(--ink-35);margin-bottom:16px;}
.state-title{font-size:14.5px;font-weight:600;color:var(--ink);margin-bottom:4px;}
.state-desc{font-size:12.75px;max-width:340px;line-height:1.5;margin-bottom:16px;}
.skeleton{background:linear-gradient(90deg,var(--ink-08) 25%,var(--ink-16) 37%,var(--ink-08) 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:6px;}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--blue-900);background-image:radial-gradient(circle at 20% 20%, var(--blue-700), var(--blue-900) 60%);padding:24px;}
.login-card{background:#fff;border-radius:18px;padding:36px 32px;width:100%;max-width:380px;box-shadow:var(--shadow-pop);}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:26px;}
.login-title{font-size:17px;font-weight:700;margin:0 0 4px;}
.login-sub{font-size:12.75px;color:var(--ink-55);margin:0 0 24px;}
.login-foot{text-align:center;font-size:11.5px;color:var(--ink-35);margin-top:22px;}

/* prototype index */
.idx-groups{display:flex;flex-direction:column;gap:22px;}
.idx-group h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-55);margin:0 0 10px;}
.idx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;}
.idx-card{display:flex;align-items:center;gap:10px;border:1px solid var(--ink-08);border-radius:9px;padding:10px 12px;background:#fff;text-align:left;}
.idx-card:hover{border-color:var(--blue-300);}
.idx-num{font-family:var(--font-mono);font-size:11px;color:var(--ink-35);width:20px;flex:0 0 auto;}
.idx-name{font-size:12.75px;font-weight:500;flex:1;}
.idx-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
.idx-dot.ready{background:var(--success);}
.idx-dot.todo{background:var(--ink-16);}

.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--orange-600);font-weight:700;margin:0 0 6px;}
.pagetitle{font-size:20px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em;}
.pagedesc{font-size:13px;color:var(--ink-55);margin:0 0 20px;max-width:640px;}

/* ---------- formatting helpers ---------- */
function money(v){
  return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

function dateBR(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function dateTimeBR(iso){
  const d = new Date(iso);
  return dateBR(iso.slice(0,10)) + ' ' + iso.slice(11,16);
}
function competenciaFmt(v){
  const meses=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const [y,m]=v.split('-');
  return `${meses[parseInt(m,10)-1]}/${y}`;
}
function cpfFmt(v){
  return v.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');
}
function cnpjFmt(v){
  return v.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');
}
function relativeDue(iso){
  const today = new Date('2026-08-19T00:00:00');
  const d = new Date(iso+'T00:00:00');
  const diff = Math.round((d-today)/86400000);
  if(diff===0) return 'hoje';
  if(diff===1) return 'amanhã';
  if(diff>1) return `em ${diff} d`;
  return `${Math.abs(diff)} d atrás`;
}
function initials(name){
  const parts = name.trim().split(' ');
  return (parts[0][0] + (parts[parts.length-1][0]||'')).toUpperCase();
}

function go(screen, param){
  state.screen = screen; state.param = param; state.modal = null; state.selectedTransition = null;
  state.drawerOpen = false;
  state.history.push(screen);
  window.scrollTo(0,0);
  render();
}
function openModal(type, param){ state.modal = {type, param}; state.selectedTransition = null; render(); }
function closeModal(){ state.modal = null; render(); }
function toggleDrawer(){ state.drawerOpen = !state.drawerOpen; render(); }
function setViewport(v){ state.viewport = v; state.drawerOpen=false; render(); }
function pushToast(kind, text){
  const id = Date.now();
  state.toasts.push({id, kind, text});
  render();
  setTimeout(()=>{ state.toasts = state.toasts.filter(t=>t.id!==id); render(); }, kind==='error'?6000:4000);
}
function jumpToIndexEntry(entry){
  state.screen = entry.key; state.param = entry.param || null; state.modal = entry.modal ? {type:entry.modal, param:entry.param} : null;
  state.selectedTransition = null;
  if(entry.forceMobile){ state.viewport='mobile'; }
  state.drawerOpen = !!entry.forceDrawer;
  render();
}
function selectFromIndex(n){
  const entry = SCREEN_INDEX.find(e=>e.n===n);
  if(entry) jumpToIndexEntry(entry);
}
function stepIndex(dir){
  const key = state.screen;
  let idx = SCREEN_INDEX.findIndex(e=>e.key===key && (!state.modal || e.modal===state.modal.type));
  if(idx===-1) idx = SCREEN_INDEX.findIndex(e=>e.key===key);
  if(idx===-1) idx = 0;
  let next = idx + dir;
  if(next<0) next = SCREEN_INDEX.length-1;
  if(next>=SCREEN_INDEX.length) next = 0;
  jumpToIndexEntry(SCREEN_INDEX[next]);
}

function shell(title, desc, actionsHtml, bodyHtml, opts){
  opts = opts || {};
  return `
  <div class="app-shell">

    <div class="main-col">
      ${topbarHtml(title, desc, actionsHtml)}
      <div class="content ${opts.narrow?'content-narrow':''}">${bodyHtml}</div>

  </div>`;
}

/* ============================================================
   Root render + modal + toast overlay
   ============================================================ */
function render(){
  const root = document.getElementById('app-root');
  const device = document.getElementById('device');
  device.className = 'device ' + (state.viewport==='mobile' ? 'mobile' : '');
  root.innerHTML = screenHtml() + modalHtml() + toastHtml();
  renderProtoTopbar();
}

function screenHtml(){
  const fn = SCREENS[state.screen];
  if(fn) return fn(state.param);
  return screenEmConstrucao(state.screen);
}

function modalHtml(){
  if(!state.modal) return '';
  const fn = MODALS[state.modal.type];
  if(!fn) return '';
  return `<div class="modal-scrim" onclick="if(event.target===this) closeModal()">${fn(state.modal.param)}</div>`;
}

function toastHtml(){
  if(!state.toasts.length) return '';
  return `<div class="toast-stack">${state.toasts.map(t=>`
    <div class="toast ${t.kind}">${icon(t.kind==='error'?'alertOctagon':'checkCircle',17)}<div>${t.text}</div></div>
  `).join('')}</div>`;
}

function screenRelatorios(){
  const total = PAGAMENTOS.reduce((s,p)=>s+p.valor,0);
  const qtd = PAGAMENTOS.length;
  const porStatus = {};
  PAGAMENTOS.forEach(p=>{ porStatus[p.status]=(porStatus[p.status]||{total:0,qtd:0}); porStatus[p.status].total+=p.valor; porStatus[p.status].qtd++; });
  const porCategoria = {};
  PAGAMENTOS.forEach(p=>{ porCategoria[p.categoria]=(porCategoria[p.categoria]||0)+p.valor; });
  const catMax = Math.max(...Object.values(porCategoria));

  const body = `
    <div class="filter-bar">
      <div class="field-control field-date">${icon('calendar',14)}<input placeholder="Período — de"></div>
      <div class="field-control field-date">${icon('calendar',14)}<input placeholder="Período — até"></div>
      <div class="field-control field-select"><select><option>Categoria — todas</option>${CATEGORIAS.map(c=>`<option>${c.nome}</option>`).join('')}</select></div>
      <div class="field-control field-select"><select><option>Status — todos</option>${Object.values(STATUS_PAGAMENTO).map(v=>`<option>${v.label}</option>`).join('')}</select></div>
      <button class="btn btn-secondary btn-sm" onclick="openModal('exportar')">${icon('download',15)}Exportar</button>
    </div>

    <div class="indicators" style="grid-template-columns:repeat(2,1fr);margin-bottom:20px;">
      <div class="indicator-card"><div class="indicator-label">Total no período</div><div class="indicator-value">${money(total)}</div><div class="indicator-detail">${qtd} lançamentos</div></div>
      <div class="indicator-card"><div class="indicator-label">Ticket médio</div><div class="indicator-value">${money(total/qtd)}</div><div class="indicator-detail">por lançamento</div></div>
    </div>

    <div class="detail-grid">
      <div class="card">
        <div class="card-header"><h2>Por status</h2></div>
        <div class="table-wrap"><table class="grid"><thead><tr><th>Status</th><th class="num">Quantidade</th><th class="num">Total</th></tr></thead>
        <tbody>${Object.entries(porStatus).map(([k,v])=>`<tr><td>${chip(STATUS_PAGAMENTO,k)}</td><td class="num mono">${v.qtd}</td><td class="num cell-money">${money(v.total)}</td></tr>`).join('')}</tbody></table></div>
      </div>
      <div class="card card-pad">
        <h2 style="font-size:14.5px;margin:0 0 14px;font-weight:600;">Por categoria</h2>
        ${Object.entries(porCategoria).sort((a,b)=>b[1]-a[1]).map(([nome,total])=>`
          <div class="prop-row"><div class="prop-top"><span class="pname">${nome}</span><span class="pval">${money(total)}</span></div>
          <div class="prop-track"><div class="prop-fill" style="width:${Math.round(total/catMax*100)}%"></div></div></div>`).join('')}
      </div>
    </div>
  `;
  return shell('Relatórios','Resumo consolidado de pagamentos por status e categoria', '', body);
}

  const body = `

    <h2 class="pagetitle">Índice das 40 telas do briefing</h2>
    <p class="pagedesc">Ordenadas por prioridade, como no documento original. ${readyCount} de ${SCREEN_INDEX.length} desenhadas nesta rodada — as demais usam o marcador "Em construção" com a mesma casca e gramática visual.</p>
    <div class="idx-groups">
      ${Object.entries(groups).map(([g,items])=>`
        <div class="idx-group">
          <h4>${g}</h4>
          <div class="idx-grid">
            ${items.map(e=>`
              <button class="idx-card" onclick="selectFromIndex(${e.n})">
                <span class="idx-num">${String(e.n).padStart(2,'0')}</span>
                <span class="idx-name">${e.t}</span>

              </button>`).join('')}

        </div>`).join('')}
    </div>
  `;
  return shell('Índice do protótipo','Navegação de referência — não faz parte do produto final', '', body);
}

/* ============================================================
   Prototype chrome topbar (meta — screen picker, viewport toggle)
   ============================================================ */
function renderProtoTopbar(){
  const bar = document.getElementById('proto-topbar');
  const readyCount = SCREEN_INDEX.filter(e=>BUILT_KEYS.has(e.key)).length;
  const groups = {};
  SCREEN_INDEX.forEach(e=>{ (groups[e.g]=groups[e.g]||[]).push(e); });
  const currentEntry = SCREEN_INDEX.find(e=>e.key===state.screen && (!state.modal ? !e.modal : e.modal===state.modal.type))
                     || SCREEN_INDEX.find(e=>e.key===state.screen) || SCREEN_INDEX[0];

  bar.innerHTML = `
    <div class="proto-brand"><span class="dot"></span>PayrollOS — Protótipo</div>
    <div class="proto-sep"></div>
    <button class="proto-nav-btn" onclick="stepIndex(-1)" title="Tela anterior">${icon('chevronLeft',13)}</button>
    <select class="proto-select" onchange="selectFromIndex(parseInt(this.value,10))">
      ${Object.entries(groups).map(([g,items])=>`
        <optgroup label="${g}">
          ${items.map(e=>`<option value="${e.n}" ${e.n===currentEntry.n?'selected':''}>${String(e.n).padStart(2,'0')} · ${e.t}</option>`).join('')}
        </optgroup>`).join('')}
    </select>
    <button class="proto-nav-btn" onclick="stepIndex(1)" title="Próxima tela">${icon('chevronRight',13)}</button>
    <button class="proto-nav-btn" onclick="go('prototype-index')">${icon('menu',13)}Índice</button>
    <span class="proto-count"><b>${readyCount}/${SCREEN_INDEX.length}</b> telas desenhadas</span>
    <div class="proto-right">
      <div class="proto-viewport-toggle">
        <button class="${state.viewport==='desktop'?'active':''}" onclick="setViewport('desktop')">${icon('file',13)}Desktop</button>
        <button class="${state.viewport==='mobile'?'active':''}" onclick="setViewport('mobile')">${icon('receipt',13)}Mobile</button>
      </div>
    </div>
  `;
}

/* ============================================================
   Expose handlers referenced by inline HTML onclick attributes
   ============================================================ */
window.go = go;
window.openModal = openModal;
window.closeModal = closeModal;
window.toggleDrawer = toggleDrawer;
window.setViewport = setViewport;
window.pushToast = pushToast;
window.selectFromIndex = selectFromIndex;
window.stepIndex = stepIndex;

/* ============================================================
   Init
   ============================================================ */
render();

})();
